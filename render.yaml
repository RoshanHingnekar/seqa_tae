services:
  - type: web
    name: qaestimator-pro
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run db:push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
