services:
  - type: web
    name: software-testing-resource-estimator
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: estimator-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: estimator-postgres-db
    databaseName: estimator_db
    user: estimator_user
    region: oregon
    plan: free
